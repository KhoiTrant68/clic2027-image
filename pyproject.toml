[project]
name = "clic27"
version = "0.1.0"
description = "CLIC 2027 image compression (GPU track) submission"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
eval = ["torch", "lpips", "piq", "torchmetrics", "torch-fidelity", "easyocr"]
ae = ["safetensors", "huggingface_hub"]
parity = ["diffusers", "accelerate"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
